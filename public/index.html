function loadDemo(){
  snapshot();
  state.notes = []; state.nextId = 1;
  state.selection.clear(); state.selected = null;
  const L = COLS;
  const put = (inst, col, row, len = 1, vol = 0.8) => {
    if (col >= L) return;
    state.notes.push({ id: state.nextId++, inst, col, row, length: len, vol, pitch: 0, speed: 1, bufferStart: 0 });
  };
  for (let i = 0; i < L; i += 8) put('drm_kick', i, 18, 1, 0.95);
  for (let i = 4; i < L; i += 8) put('drm_snare', i, 16, 1, 0.7);
  for (let i = 0; i < L; i += 2) put('drm_hat', i, 12, 1, 0.35);
  for (let i = 0; i < L; i += 8){ put('bas_1', i, 20, 3, 0.85); put('bas_3', i + 4, 20, 2, 0.5); }
  const chords = [[8,11,15],[7,10,14],[5,8,12],[7,10,14]];
  for (let b = 0; b < Math.floor(L / 16); b++) chords[b % chords.length].forEach(r => put('pno_piano', b * 16, r, 6, 0.42));
  const mel = [8,10,12,13,15,13,12,10];
  let mi = 0;
  for (let i = 0; i < L; i += 4){ put('trp_1', i, mel[mi % mel.length], 3, 0.35); mi++; }
  put('vln_1', 32, 6, 12, 0.3);
  put('cym_crash', 0, 2, 6, 0.5);
  put('cym_crash', 32, 2, 6, 0.5);
  updateSelBadge(); draw(); scheduleAutosave();
  toast('Пример загружен 🎵');
}

/* ================================================== Gemini через прокси */
const SYSTEM_PROMPT = `Ты — музыкальный ИИ-ассистент для SND Studio (браузерный трекер, похожий на FL Studio).
Пользователь пишет промт словами, ты возвращаешь ТОЛЬКО валидный JSON с готовой музыкой.

ФОРМАТ ОТВЕТА (строго JSON, без markdown, без пояснений):
{
  "genre": "pop",
  "mode": "melody",
  "bpm": 120,
  "bars": 8,
  "loop": false,
  "notes": [
    {"inst": "drm_kick", "col": 0, "row": 18, "length": 1, "vol": 0.9},
    {"inst": "drm_snare", "col": 4, "row": 16, "length": 1, "vol": 0.7}
  ]
}

ПРАВИЛА:
1. Определи жанр: pop / rock / electronic / hiphop / classical
2. Режим: "melody" (компактный повторяющийся грув) или "music" (развёрнутое сочинение с драматургией)
3. BPM: 40-240 (если не указан — выбери подходящий жанру)
4. Если пользователь что-то не уточнил — ВЫБЕРИ САМ, не задавай вопросов.

РЕЖИМ, КАК ПИСАТЬ НОТЫ:
- melody: верни компактный паттерн (4-8 тактов нот) и СТАВЬ "loop": true — студия сама размножит его повторами на всю длину bars. Идеально для битов, лупов, простых грувов.
- music: ноты реально записаны на ВСЕ bars тактов — с развитием: вступление, куплет/припев, динамика, концовка. Тогда "loop": false.

ГЛАВНОЕ ПРАВИЛО — ДЛИНА (bars):
5. Если пользователь назвал число тактов ("на 50 тактов") — bars = РОВНО это число (1-200). НИКОГДА не уменьшай.
6. Песня НЕ МОЖЕТ кончаться раньше bars. Допустимы ровно два пути:
   а) "loop": true — notes покрывают компактный паттерн (обычно 4-8 тактов), студия повторит его до полного bars;
   б) "loop": false — ноты реально записаны на все bars*16 шагов, последние удары/аккорды находятся у col >= (bars-1)*16. Разрешено ТОЛЬКО при bars <= 32.
7. Пример: просят 50 тактов. Хочешь дать бас/ударный луп на 4 такта — отдай его с "bars": 50, "loop": true, студия разложит луп на 50 тактов. ОТВЕТ bars=4 НЕДОПУСТИМ, если просили 50. Для развёрнутой композиции на 50 тактов пиши все секции последовательно на все шаги.
8. Если просят bars > 32 — НЕ выписывай все такты по нотам: собери качественную композицию на 16-32 такта (внутри неё всё развитие) и отдай её с bars = запрошенному числу и "loop": true — студия зациклит до нужной длины.

ЧАТ И РЕДАКТИРОВАНИЕ:
9. Диалог может длиться несколько ходов. В последнем промте пользователя может быть блок [ТЕКУЩИЙ ТРЕК В РЕДАКТОРЕ: {...}] — это текущие ноты проекта в твоём же JSON-формате.
10. Если пользователь просит "создай новую", "с нуля", "другой жанр", "новая песня" — верни полностью НОВУЮ песню, игнорируя прежний трек.
11. Во всех остальных случаях промт в чате — ПРАВКА текущего трека: сохрани то, что не просят менять (длину bars, BPM, характер) и внеси ровно запрошенные изменения, вернув ПОЛНЫЙ notes[] всей песни после правки.

ПЛОТНОСТЬ И ПАРТИИ (важность как у длины):
12. Редкая и пустая музыка недопустима: средняя плотность 4-8 нот на такт (удары + бас + аккорд + мелодия).
13. Тишина допустима не дольше 1-2 тактов подряд (интро или финальная пауза) — затем музыка ОБЯЗАНА вернуться.
14. ВНУТРИ ПАРТИЙ НЕ БЫВАЕТ "пустыней": каждый инструмент играет непрерывно всю свою секцию. Зазор между соседними нотами ОДНОГО и того же инструмента — максимум 4-8 шагов; исключение — намеренная пауза на смене секции (не длиннее 2 тактов).
15. НЕ делай короткие "бипы": бас length 3-8 (тянущие ноты), аккорды/пэды length 6-16, мелодия length 2-6; только барабаны length 1.
16. В mode "music" разнообразь по секциям: куплет легче, припев плотнее; меняй рисунок баса и хэтов между секциями.

КООРДИНАТЫ:
- col: 0..(bars*16-1). 1 такт = 16 шагов. Доли: 0,4,8,12.
- row: 0..23. Меньше row = выше нота. 12 = A3.
  Бас 18-22, аккорды 8-14, мелодия 3-11.
- length: минимум 0.2. Барабаны всегда 1.
- vol: 0.05-1. Барабаны 0.7-1, аккорды 0.3-0.5, мелодия 0.5-0.8.

МУЗЫКАЛЬНЫЕ ПРАВИЛА:
- Kick: шаги 0 и 8 (для электроники ещё 4, 12).
- Snare: шаги 4 и 12.
- Hat: чётные шаги или все (электроника).
- Бас: корни аккордов на 0 и 8, row 18-22.
- Аккорды: трезвучия (root+терция+квинта) на шаге 0, длина 4-8.
- Мелодия: пентатоника или гамма тональности, соседние ноты на шаг ±1-2 по гамме, row 3-11.

ДОСТУПНЫЕ ИНСТРУМЕНТЫ (используй только эти id):
${INST_DEFS.map(i => `- ${i.id} (${i.name})`).join('\n')}

СЛЕДУЙ ПОЖЕЛАНИЯМ:
- Просит "только барабаны" — только drm_kick, drm_snare, drm_hat.
- Просит "без барабанов" — не используй drm_*.
- Просит конкретные инструменты — только их.
- Не задавай вопросов — выбирай сам.

УНИКАЛЬНОСТЬ:
- Каждая генерация должна быть РАЗНОЙ. Варьируй мелодию, ритм, velocity, длительности.
- Не повторяй одни и те же паттерны.

Возвращай ТОЛЬКО JSON. Без текста до, после или внутри.`;

async function callGeminiProxy(contents){
  const resp = await fetch('/api/gemini', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contents, system: SYSTEM_PROMPT, temperature: 1.1 }),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok){
    throw new Error(data.error || `Ошибка ${resp.status}`);
  }
  const text = (data.text || '').trim();
  if (!text) throw new Error('Пустой ответ от Gemini');
  let jsonStr = text;
  if (jsonStr.startsWith('```')) jsonStr = jsonStr.replace(/^```(?:json)?\s*/, '').replace(/```\s*$/, '');
  return JSON.parse(jsonStr);
}

/* ============================ чат с Gemini ============================ */
let chatLog = [];           // {role:'user'|'model', text, state?, result?, askedBars?, hint?}
let amgBarsTouched = false; // пользователь менял поле «ТАКТЫ» вручную
const MAX_CHAT_ENTRIES = 12;   // сколько сообщений отправляем в контекст
const MAX_STATE_NOTES = 800;   // сколько нот текущего трека отдаём Gemini

// "сделай трек на 50 тактов" -> 50
function parseBarsFromPrompt(text){
  const m = /(\d+)\s*(такт[а-яё]*|бар[а-яё]*|bars?)/i.exec(String(text || ''));
  if (!m) return null;
  return Math.max(1, Math.min(MAX_BARS, parseInt(m[1], 10)));
}

// текущий трек в том же JSON-формате, что отдаёт Gemini
function buildTrackStateJSON(){
  const all = state.notes.map(n => ({ inst: n.inst, col: n.col, row: n.row, length: n.length, vol: n.vol }));
  const head = all.length > MAX_STATE_NOTES ? all.slice(0, MAX_STATE_NOTES) : all;
  let s = JSON.stringify({ bpm: state.bpm, bars: BARS, notes: head });
  if (all.length > MAX_STATE_NOTES) s += ` // показаны первые ${MAX_STATE_NOTES} нот из ${all.length}`;
  return s;
}

// история -> contents для Google (в последнем сообщении юзера — состояние трека)
function buildChatContents(){
  const log = chatLog.slice(-MAX_CHAT_ENTRIES);
  const out = [];
  for (let i = 0; i < log.length; i++){
    const m = log[i];
    if (m.role === 'user'){
      let text = m.text;
      if (m.hint) text += m.hint;
      if (i === log.length - 1 && m.state){
        text += '\n\n[ТЕКУЩИЙ ТРЕК В РЕДАКТОРЕ — твоим же JSON-форматом: ' + m.state +
          '. Если промт — правка, верни полный notes[] всей песни с внесёнными изменениями; если просят новую — сделай с нуля]';
      }
      out.push({ role: 'user', parts: [{ text }] });
    } else {
      out.push({ role: 'model', parts: [{ text: m.text }] });
    }
  }
  return out;
}

function renderAMGChat(){
  const wrap = document.getElementById('amgChat');
  const head = document.getElementById('amgChatHead');
  if (!wrap || !head) return;
  const visible = chatLog.length > 0;
  wrap.style.display = visible ? 'flex' : 'none';
  head.style.display = visible ? 'flex' : 'none';
  if (!visible) return;
  wrap.innerHTML = '';
  for (const m of chatLog){
    const div = document.createElement('div');
    div.className = 'amg-msg ' + (m.role === 'user' ? 'user' : 'assist');
    div.textContent = m.text;
    if (m.role === 'model' && m.result){
      div.appendChild(document.createElement('br'));
      const b = document.createElement('button');
      b.className = 'apply';
      b.textContent = '↩ Применить этот трек заново';
      b.onclick = () => {
        try { applyAIMusic(m.result, m.askedBars); toast('Трек из чата применён ✓'); }
        catch (e){ toast('Ошибка: ' + e.message); }
      };
      div.appendChild(b);
    }
    wrap.appendChild(div);
  }
  wrap.scrollTop = wrap.scrollHeight;
}

function normalizeAINotes(rawNotes){
  const validIds = new Set(INST_DEFS.map(i => i.id));
  const list = [];
  let effEnd = 0;
  for (const raw of rawNotes || []){
    if (!raw || typeof raw !== 'object') continue;
    const inst = String(raw.inst || '');
    if (!validIds.has(inst)) continue;
    const col = Math.max(0, Math.min(COLS - 1, Math.floor(Number(raw.col) || 0)));
    const row = Math.max(0, Math.min(ROWS - 1, Math.floor(Number(raw.row) || CENTER_ROW)));
    let len = Number(raw.length);
    if (!isFinite(len) || len < MIN_NOTE_LEN) len = 1;
    len = Math.round(Math.min(len, COLS - col) * 100) / 100;
    const vol = Math.max(0.05, Math.min(1, Number(raw.vol) || 0.8));
    list.push({ inst, col, row, length: len, vol });
    effEnd = Math.max(effEnd, col + len);
  }
  return { list, effBars: Math.max(1, Math.ceil(effEnd / STEPS_PER_BAR)) };
}

async function applyAIMusic(result, askedBars){
  if (!result || !Array.isArray(result.notes)) throw new Error('Нет поля notes[]');
  snapshot();
  state.notes = [];
  state.selection.clear();
  state.selected = null;
  const bpm = Math.max(40, Math.min(240, Number(result.bpm) || 120));
  let bars = Math.max(1, Math.min(MAX_BARS, Number(result.bars) || 8));
  if (askedBars) bars = askedBars; // явное желание пользователя важнее выдумки модели
  state.bpm = bpm;
  BARS = bars;
  COLS = BARS * STEPS_PER_BAR;
  state.playhead = 0;
  playheadPos = 0;
  document.getElementById('bpmInput').value = bpm;
  document.getElementById('barsInput').value = bars;
  document.getElementById('posInput').value = 0;
  document.getElementById('posInput').max = COLS - 1;
  updateGridSize();

  const { list: base, effBars } = normalizeAINotes(result.notes);

  // ГЛАВНОЕ: если ноты короче заявленной длины — зацикливаем их на все bars
  let tiles = 1;
  if (base.length && effBars < bars){
    tiles = Math.ceil(bars / effBars);
    const step = effBars * STEPS_PER_BAR;
    const tiled = [];
    for (let k = 0; k < tiles; k++){
      for (const n of base){
        const col = n.col + k * step;
        if (col < COLS) tiled.push({ ...n, col, length: Math.min(n.length, COLS - col) });
      }
    }
    base.length = 0;
    base.push(...tiled);
  }

  for (const n of base){
    state.notes.push({
      id: state.nextId++, inst: n.inst, col: n.col, row: n.row,
      length: n.length, vol: n.vol, pitch: 0, speed: 1, bufferStart: 0,
    });
  }
  updateSelBadge(); draw(); scheduleAutosave();
  return { bpm, bars, added: state.notes.length, looped: tiles > 1, effBars,
    mode: result.mode, genre: result.genre };
}

function setProgress(p, done){
  const fill = document.getElementById('amgProgressFill');
  const pct = document.getElementById('amgProgressPct');
  if (!fill || !pct) return;
  fill.style.width = p + '%';
  pct.textContent = Math.round(p) + '%';
  pct.classList.toggle('done', !!done);
}

async function generateViaGemini(){
  const promptInput = document.getElementById('geminiPrompt');
  const prompt = (promptInput.value || '').trim();
  if (!prompt){ alert('Введи промт'); return; }
  const overlay = document.getElementById('amgProgressOverlay');
  const title = document.getElementById('amgProgressTitle');
  const sub = document.getElementById('amgProgressSub');
  const btn = document.getElementById('geminiGenerate');
  overlay.style.display = 'flex';
  title.textContent = 'Генерирование…';
  sub.innerHTML = '<span class="amg-spinner"></span>Gemini думает над музыкой…';
  setProgress(15);
  btn.disabled = true;
  try {
    let fakeP = 15;
    const fakeInterval = setInterval(() => {
      if (fakeP < 85) fakeP += Math.random() * 4;
      setProgress(fakeP);
    }, 350);

    // если юзер не назвал такты словами, но трогал поле «ТАКТЫ» — шлём подсказку модели
    let askedBars = parseBarsFromPrompt(prompt);
    let hint = null;
    if (!chatLog.length && !askedBars && amgBarsTouched){
      const bv = Math.max(1, Math.min(MAX_BARS, Math.round(+document.getElementById('barsInput').value) || 0));
      if (bv){
        askedBars = bv;
        hint = `\n\n[СТУДИЯ: пользователь выставил в поле «ТАКТЫ» ${bv} — bars обязан быть ровно ${bv}]`;
      }
    }

    chatLog.push({ role: 'user', text: prompt, state: buildTrackStateJSON(), hint, askedBars });
    let result;
    try {
      result = await callGeminiProxy(buildChatContents());
    } catch (e){
      chatLog.pop(); // неудавшийся промт не остаётся в чате
      throw e;
    }
    clearInterval(fakeInterval);
    setProgress(90);
    sub.innerHTML = '<span class="amg-spinner"></span>вставляю ноты на сетку…';
    await new Promise(r => setTimeout(r, 250));
    const info = await applyAIMusic(result, askedBars);
    const tiles = info.looped ? Math.ceil(info.bars / info.effBars) : 0;
    chatLog.push({ role: 'model',
      text: `Готово: ${info.genre || 'музыка'} · ${info.mode === 'music' ? 'Музыка' : 'Мелодия'} · ${info.bars} тактов · ${info.bpm} BPM · ${info.added} нот` +
        (info.looped ? ` (паттерн ${info.effBars} т. зациклен ×${tiles})` : ''),
      result, askedBars });
    promptInput.value = '';
    renderAMGChat();
    setProgress(100, true);
    title.textContent = 'Генерация музыки завершена!';
    const genreName = info.genre || 'music';
    const modeName = info.mode === 'music' ? 'Музыка' : 'Мелодия';
    sub.textContent = `${genreName} · ${modeName} · ${info.bars} тактов · ${info.bpm} BPM · ${info.added} нот` +
      (info.looped ? ` · луп ${info.effBars}т ×${tiles}` : '');
    await new Promise(r => setTimeout(r, 900));
    overlay.style.display = 'none';
    toast(`🤖 ${genreName} · ${modeName} · ${info.added} нот`);
  } catch (err){
    console.error('Gemini error:', err);
    overlay.style.display = 'none';
    alert('Ошибка генерации:\n\n' + err.message +
      '\n\nВозможные причины:\n' +
      '• Google перегружена — нажми «Сгенерировать» ещё раз (сервер сам пробует запасные модели)\n' +
      '• Неверный API-ключ (проверь .env на сервере)\n' +
      '• Квота исчерпана (бесплатно: 15 запросов/мин)\n' +
      '• Сервер не запущен или недоступен /api/gemini');
  } finally {
    btn.disabled = false;
  }
}

/* ================================================== init */
async function init(){
  rebuildInstMap();
  renderPalette();
  loadHotkeys();
  updateGridSize();
  updateBarsInput();
  updatePosInput();
  document.getElementById('posInput').max = Math.max(0, COLS - 1);
  updateSelBadge();
  draw();

  document.getElementById('btnPlay').onclick = () => { state.playing ? stopPlay() : startPlay(); };
  document.getElementById('btnSettings').onclick = openSettings;
  document.getElementById('btnDemo').onclick = loadDemo;
  document.getElementById('zoomIn').onclick = () => { setZoom(zoomLevel * 1.2); scheduleAutosave(); };
  document.getElementById('zoomOut').onclick = () => { setZoom(zoomLevel / 1.2); scheduleAutosave(); };

  document.getElementById('btnAMG').onclick = () => {
    const panel = document.getElementById('amgPanel');
    if (panel.classList.contains('open')) closeAMGPanel();
    else openAMGPanel();
  };
  document.getElementById('amgClose').onclick = closeAMGPanel;
  document.getElementById('geminiGenerate').onclick = generateViaGemini;
  document.getElementById('amgChatClear').onclick = () => {
    chatLog = [];
    amgBarsTouched = false;
    renderAMGChat();
    toast('Чат очищен — следующий промт создаст новую песню с нуля');
  };
  renderExamplePrompts();

  const bpmInp = document.getElementById('bpmInput');
  bpmInp.onchange = () => {
    let v = Math.max(40, Math.min(240, Math.round(+bpmInp.value) || 120));
    state.bpm = v; bpmInp.value = v;
    recomputeAllCustomLengths(); draw(); scheduleAutosave();
  };
  bpmInp.onkeydown = e => { if (e.key === 'Enter') bpmInp.blur(); };

  const barsInp = document.getElementById('barsInput');
  barsInp.onchange = () => {
    let v = Math.max(1, Math.min(MAX_BARS, Math.round(+barsInp.value) || 4));
    applyBars(v); barsInp.value = BARS;
    amgBarsTouched = true;
  };
  barsInp.onkeydown = e => { if (e.key === 'Enter') barsInp.blur(); };

  const posInp = document.getElementById('posInput');
  posInp.onchange = () => {
    let v = Math.max(0, Math.min(COLS - 1, Math.round((+posInp.value) * 100) / 100 || 0));
    setPlayhead(v); posInp.value = state.playhead;
    scheduleAutosave();
  };
  posInp.onkeydown = e => { if (e.key === 'Enter') posInp.blur(); };

  window.addEventListener('beforeunload', () => {
    try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(projectData())); } catch (e){}
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden'){
      try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(projectData())); } catch (e){}
    }
  });

  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.getElementById('amgPanel').classList.contains('open')){
      if (document.getElementById('amgProgressOverlay').style.display === 'flex') return;
      closeAMGPanel();
    }
  });

  const restored = await tryLoadAutosave();
  if (restored){ toast('Проект восстановлен ✓'); }
  else { setTimeout(() => toast('🤖 AI Music — генерация музыки через Gemini'), 500); }
}

init();
